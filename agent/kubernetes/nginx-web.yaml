apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-pvc
  labels:
    app: nginx-web
    version: v1.0.0
    environment: development
    managed-by: kodo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard # GKE default StorageClass for Persistent Disks

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web-deployment
  labels:
    app: nginx-web
    version: v1.0.0
    environment: development
    managed-by: kodo
spec:
  replicas: 1 # Mínimo de 1 réplica para ambiente "production-ready"
  selector:
    matchLabels:
      app: nginx-web
      environment: development
  template:
    metadata:
      labels:
        app: nginx-web
        version: v1.0.0
        environment: development
        managed-by: kodo
    spec:
      securityContext:
        runAsUser: 1001 # Usuário não-root para o Nginx
        runAsGroup: 1001
        fsGroup: 1001 # Garante que o volume montado tenha as permissões corretas
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-nginx-content
          image: busybox:1.36.1 # Imagem específica para o initContainer
          command: ["sh", "-c", "echo '<h1>Hello from Kodo Nginx!</h1><p>This is a persistent index.html.</p>' > /usr/share/nginx/html/index.html"]
          volumeMounts:
            - name: nginx-persistent-storage
              mountPath: /usr/share/nginx/html
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: nginx
          image: nginx:1.25.3 # Versão estável e específica do Nginx
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: nginx-persistent-storage
              mountPath: /usr/share/nginx/html
              readOnly: true # Nginx não precisa escrever no diretório de conteúdo após a inicialização
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: nginx-persistent-storage
          persistentVolumeClaim:
            claimName: nginx-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-web-service
  labels:
    app: nginx-web
    version: v1.0.0
    environment: development
    managed-by: kodo
spec:
  selector:
    app: nginx-web
    environment: development
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP # Expõe o serviço externamente com um LoadBalancer do provedor de nuvem (GKE)

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-web-network-policy
  labels:
    app: nginx-web
    version: v1.0.0
    environment: development
    managed-by: kodo
spec:
  podSelector:
    matchLabels:
      app: nginx-web
      environment: development
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {} # Permite entrada de qualquer pod no mesmo namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system # Permite entrada de componentes do sistema (ex: kube-proxy)
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53 # Permite apenas tráfego DNS (UDP)
        - protocol: TCP
          port: 53 # Permite apenas tráfego DNS (TCP)