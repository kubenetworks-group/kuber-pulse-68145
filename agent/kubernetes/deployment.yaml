apiVersion: v1
kind: Namespace
metadata:
  name: kodo
  labels:
    name: kodo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kodo-agent
  namespace: kodo
  labels:
    app: kodo-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kodo-agent
  labels:
    app: kodo-agent
rules:
# Recursos básicos de leitura
- apiGroups: [""]
  resources: ["nodes", "pods", "events", "persistentvolumeclaims", "persistentvolumes", "secrets", "resourcequotas", "limitranges", "services", "configmaps", "endpoints"]
  verbs: ["get", "list", "watch"]
# Namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Acesso a métricas dos nodes
- apiGroups: [""]
  resources: ["nodes/proxy", "nodes/stats", "nodes/metrics"]
  verbs: ["get"]
# Deletar pods (para remediation)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
# Exec em pods (para debugging)
- apiGroups: [""]
  resources: ["pods/exec", "pods/log"]
  verbs: ["create", "get"]
# Workloads
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Autoscaling
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
# Batch jobs
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# Storage
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "volumeattachments"]
  verbs: ["get", "list", "watch"]
# Métricas (importante para FinOps)
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
# RBAC
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
# Networking
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses", "ingressclasses"]
  verbs: ["get", "list", "watch"]
# Coordination
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update"]
# Pod Disruption Budgets
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kodo-agent
  labels:
    app: kodo-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kodo-agent
subjects:
- kind: ServiceAccount
  name: kodo-agent
  namespace: kodo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kodo-config
  namespace: kodo
  labels:
    app: kodo-agent
data:
  API_ENDPOINT: "https://dadaeduevxyvkhjmwlel.supabase.co/functions/v1"
  COLLECT_INTERVAL: "15"
  LOG_LEVEL: "info"
  # Adicione conforme necessário
---
apiVersion: v1
kind: Secret
metadata:
  name: kodo-secret
  namespace: kodo
  labels:
    app: kodo-agent
type: Opaque
stringData:
  API_KEY: "kp_b3059e88005448959a0b90d1832730fa"
  CLUSTER_ID: "24c38b03-e9a1-4569-b076-5796cf057bdb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kodo-agent
  namespace: kodo
  labels:
    app: kodo-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kodo-agent
  template:
    metadata:
      labels:
        app: kodo-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kodo-agent
      containers:
      - name: agent
        image: ghcr.io/kubenetworks-group/kodo-agent:v0.2.81
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: kodo-config
        - secretRef:
            name: kodo-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Pod anti-affinity para melhor disponibilidade
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kodo-agent
              topologyKey: kubernetes.io/hostname
      # Tolerações para autopilot/GKE
      tolerations:
      - key: cloud.google.com/gke-preemptible
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule
