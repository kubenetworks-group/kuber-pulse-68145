<!doctype html>
<html lang="pt-BR" data-density="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kodo — Kubernetes sob controle.</title>
  <link rel="icon" href="assets/logo/kodo-symbol.png">
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="brand-icons.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="features.jsx"></script>
  <script type="text/babel" src="how-integrations.jsx"></script>
  <script type="text/babel" src="pricing-faq.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "spacious",
      "heroAccent": "ink",
      "showLogos": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-density', t.density);
      }, [t.density]);

      React.useEffect(() => {
        const accents = {
          indigo: { primary: '#0F3CA5', dark: '#0A2D7E', pale: '#E6EEF8' },
          ink:    { primary: '#1A1A1A', dark: '#000000', pale: '#E4E4E4' },
        };
        const a = accents[t.heroAccent] || accents.indigo;
        document.documentElement.style.setProperty('--indigo', a.primary);
        document.documentElement.style.setProperty('--indigo-dark', a.dark);
        document.documentElement.style.setProperty('--indigo-pale', a.pale);
        document.documentElement.style.setProperty('--info', a.primary);
        document.documentElement.style.setProperty('--info-fg', a.primary);
        document.documentElement.style.setProperty('--info-bg', a.pale);
        document.documentElement.style.setProperty('--primary', a.primary);
      }, [t.heroAccent]);

      return (
        <div data-screen-label="01 Kodo landing">
          <Nav />
          <main>
            <Hero />
            <Features />
            <HowItWorks />
            <Integrations />
            <Pricing />
            <Faq />
            <FinalCTA />
          </main>
          <Footer />

          <TweaksPanel title="Tweaks">
            <TweakSection label="Densidade">
              <TweakRadio
                label="Espaçamento"
                value={t.density}
                onChange={v => setTweak('density', v)}
                options={[
                  { value: 'compact',  label: 'Compact' },
                  { value: 'default',  label: 'Padrão' },
                  { value: 'spacious', label: 'Aberto' },
                ]}
              />
            </TweakSection>
            <TweakSection label="Acento">
              <TweakRadio
                label="Cor primária"
                value={t.heroAccent}
                onChange={v => setTweak('heroAccent', v)}
                options={[
                  { value: 'indigo', label: 'Indigo' },
                  { value: 'ink',    label: 'Ink' },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
