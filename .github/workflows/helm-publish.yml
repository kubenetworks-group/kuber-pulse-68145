name: Publish Helm Chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (e.g. 0.2.81)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # needed to set package visibility via API
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip leading 'v' from tag for chart version (semver)
            VERSION="${{ github.ref_name }}"
            CHART_VERSION="${VERSION#v}"
          else
            CHART_VERSION="${{ inputs.version }}"
            VERSION="v${CHART_VERSION}"
          fi
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Chart versions
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.chart_version }}/" agent/helm/kodo-agent/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" agent/helm/kodo-agent/Chart.yaml

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package and push Helm chart
        run: |
          helm package agent/helm/kodo-agent/ --destination /tmp/helm-charts
          helm push /tmp/helm-charts/kodo-agent-${{ steps.version.outputs.chart_version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/helm-charts

      - name: Make package public
        run: |
          # GHCR packages are private by default — set to public so end users
          # can install without authenticating.
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/helm-charts%2Fkodo-agent" \
            -d '{"visibility":"public"}' | grep -E '"visibility"|"message"' || true

      - name: Write publish summary
        run: |
          VERSION="${{ steps.version.outputs.chart_version }}"
          echo "## ✅ Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`kodo-agent\` **Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install kodo-agent oci://ghcr.io/${{ github.repository_owner }}/helm-charts/kodo-agent \\" >> $GITHUB_STEP_SUMMARY
          echo "  --version ${VERSION} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --namespace kodo --create-namespace \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set agent.apiKey=<sua-api-key> \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set agent.clusterId=<seu-cluster-id>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
