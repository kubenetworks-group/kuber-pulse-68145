name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kodo-agent:${{ github.ref_name }}

      - name: Publish agent version to Kodo backend
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "${SUPABASE_URL}" ] || [ -z "${ADMIN_API_KEY}" ]; then
            echo "⚠️  Skipping: SUPABASE_URL or ADMIN_API_KEY secrets not configured."
            echo "   Add them in GitHub → Settings → Secrets and variables → Actions"
            exit 0
          fi
          echo "📦 Publishing version ${VERSION} to Kodo backend..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/agent-publish-version" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: ${ADMIN_API_KEY}" \
            -d "{
              \"version\": \"${VERSION}\",
              \"release_notes\": \"Atualização automática via CI/CD - ${VERSION}\",
              \"release_type\": \"patch\",
              \"is_required\": false,
              \"trigger_updates\": true
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response (HTTP ${HTTP_CODE}): ${BODY}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️  Backend responded with HTTP ${HTTP_CODE} — check ADMIN_API_KEY secret"
          else
            echo "✅ Version ${VERSION} published successfully"
          fi
