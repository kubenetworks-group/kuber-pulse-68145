name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kodo-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kodo-agent:latest

      - name: Publish agent version to Kodo backend
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          VERSION="${{ github.ref_name }}"
          curl -s -X POST "${SUPABASE_URL}/functions/v1/agent-publish-version" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: ${ADMIN_API_KEY}" \
            -d "{
              \"version\": \"${VERSION}\",
              \"release_notes\": \"Atualização automática via CI/CD - ${VERSION}\",
              \"release_type\": \"patch\",
              \"is_required\": false,
              \"trigger_updates\": true
            }"
